# Generates the contribution-grid snake and publishes it to the "output"
# branch, which the profile README reads from.

name: Generate Snake

on:
  # every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # run it by hand from the Actions tab
  workflow_dispatch:
  # and whenever main changes
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # snk v3 needs the token to read the contribution calendar; without it
      # the grid comes out empty.
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#6EE7B7
            dist/github-contribution-grid-snake.gif?color_snake=#6EE7B7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
